  - "ArangoDB"

# Social links
github_username: z-varun
linkedin_username: varun-bhandari5

# Profiles for jekyll-seo-tag (emitted as schema.org sameAs)
social:
  name: "Varun Bhandari"
  links:
    - https://github.com/z-varun
    - https://www.linkedin.com/in/varun-bhandari5

# Site navigation
navigation:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Projects
    url: /projects/
  - title: Blog
    url: /blog/
  - title: Contact
    url: /contact/

# Include files for Cloudflare Pages
include:
  - .well-known
  - _headers
  - _redirects

# Exclude from processing
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - .git
  - .ruby-version
  - .ruby-lsp
  - package.json
  - package-lock.json
  - eslint.config.js
  - .stylelintrc.json
  - .prettierrc.json
  - .prettierignore

# Defaults for posts and pages
defaults:
  - scope:
      path: ""
    values:
      # Open Graph / Twitter card image unless a page sets its own
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
