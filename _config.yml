# Site settings
title: "CSWithVarun"
description: "Senior Security Engineer with 9+ years of DevSecOps, SRE, and Cloud Security experience. Specializing in Kubernetes, multi-cloud architecture, and secure CI/CD pipelines."
url: "https://www.cswithvarun.com"
baseurl: ""
timezone: Asia/Kolkata
lang: en_US

# Logo for jekyll-seo-tag; the default share image is set under defaults below
logo: /assets/images/icons8-cyber-security-100.png

# Build settings
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Feed settings
feed:
  excerpt_only: true

# Permalink structure for blog posts
permalink: /blog/:year/:month/:day/:title/

# Author details (for jekyll-seo-tag and posts)
author:
  name: "Varun Bhandari"
  bio: "Senior Security Engineer | 9+ Years DevSecOps | Building secure, resilient cloud infrastructure"
  location: "India"
  email: varun@cswithvarun.com
  title: "Senior Security Engineer"

resume_url: /assets/files/VarunBhandari-Resume.pdf

knowsAbout:
  - "DevSecOps"
  - "SRE"
  - "DevOps principles"
  - "Microservices Architecture"
  - "Distributed Systems"
  - "Project Management"
  - "AWS"
  - "GCP"
  - "Azure"
  - "EKS"
  - "GKE"
  - "AKS"
  - "RDS"
  - "CloudSQL"
  - "BigQuery"
  - "Kubernetes"
  - "Docker"
  - "Helm"
  - "Terraform"
  - "Ansible"
  - "Python3"
  - "Shell Scripting"
  - "Git"
  - "Jenkins"
  - "Azure DevOps"
  - "Github Actions"
  - "GitlabCI"
  - "CISv8"
  - "NIST"
  - "SOC2"
  - "ISO"
  - "Penetration Testing"
  - "CloudArmor"
  - "GCP SCC"
  - "GCP VPC SC"
  - "Okta"
  - "Defender"
  - "Intune"
  - "SOC Analyst"
  - "Prometheus"
  - "Grafana"
  - "Datadog"
  - "ELK Stack"
