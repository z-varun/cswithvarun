---
layout: page
title: Get In Touch
permalink: /contact/
custom_css: contact
---

<div class="contact-page">
    <section class="contact-intro">
        <p>Have a question or want to work together? I'd love to hear from you.</p>
    </section>

    <div class="contact-container">
        <div class="contact-form-section">
            <!-- Web3Forms: plain HTML POST, redirects to /thank-you/ on success -->
            <form method="POST" action="https://api.web3forms.com/submit" class="contact-form">
                <input type="hidden" name="access_key" value="8dbc121e-aa45-4726-88d0-a3fca1c45295">
                <input type="hidden" name="redirect" value="{{ '/thank-you/' | absolute_url }}">
                <input type="hidden" name="subject" value="New Contact Form Submission from cswithvarun.com">
                <input type="hidden" name="from_name" value="cswithvarun.com contact form">
                <!-- Honeypot: hidden from people, filled in by bots -->
                <input type="checkbox" name="botcheck" class="hidden" tabindex="-1" autocomplete="off" aria-hidden="true">

                <div class="form-group">
                    <label for="name">Name <span class="required" aria-hidden="true">*</span></label>
                    <input type="text" id="name" name="name" placeholder="Your Name" autocomplete="name" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" autocomplete="email" maxlength="254" required>
                </div>

                <div class="form-group">
                    <label for="topic">Subject</label>
                    <input type="text" id="topic" name="topic" placeholder="What's this about?" maxlength="150">
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required" aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="6" placeholder="Your message here..." maxlength="5000" required></textarea>
                </div>

                <p class="form-note">Fields marked <span class="required" aria-hidden="true">*</span><span class="sr-only">with an asterisk</span> are required.</p>

                <button type="submit" class="submit-btn">
                    <span>Send Message</span>
                    <i aria-hidden="true" class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>
